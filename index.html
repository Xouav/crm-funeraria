<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Ventas - Funeraria Chile (Prototipo Front-End Oficial)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="navbar navbar-dark bg-navy px-3 shadow-sm sticky-top" role="banner">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fs-6 text-white">
                <span class="badge bg-emerald me-2" aria-hidden="true">CRM Interno</span>
                Asesor: <strong id="session-user-name">...</strong> 
                (<span id="session-user-role" class="text-info">...</span>)
            </span>
            <div class="d-flex align-items-center gap-2" role="search">
                <label for="role-selector" class="text-light small text-nowrap m-0">Simular Rol:</label>
                <select id="role-selector" class="form-select form-select-sm" style="width: auto;" aria-label="Cambiar perfil de usuario simulado">
                    <option value="Vendedor">Asesor de Terreno (Vendedor)</option>
                    <option value="Administrador">Administrador de Sistemas</option>
                </select>
            </div>
        </div>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <nav id="sidebar-menu" class="col-md-3 col-lg-2 d-md-block bg-dark-navy sidebar collapse p-3" role="navigation" aria-label="Menú principal">
                <div class="position-sticky pt-3">
                    <h2 class="h6 border-bottom border-secondary pb-2 mb-3 text-uppercase text-muted tracking-wider small">Módulos</h2>
                    <ul class="nav flex-column gap-2" id="dynamic-menu-links">
                        </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="view-container" role="main" aria-live="polite">
                </main>
        </div>
    </div>

    <footer class="bg-white text-center py-3 border-top text-muted small mt-auto shadow-sm" role="contentinfo">
        <div class="container">
            &copy; 2026 CRM Comercial - Prototipo de Alta Fidelidad para Funeraria de Chile.
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>

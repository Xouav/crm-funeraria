<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Ventas - Funeraria Chile (Prototipo Front-End)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fs-6">
                <span class="badge bg-secondary me-2">CRM Interno</span>
                Operador Activo: <strong id="session-user-name">...</strong> (<span id="session-user-role">...</span>)
            </span>
            <div class="d-flex align-items-center gap-2">
                <label class="text-secondary small text-nowrap m-0">Simular Rol:</label>
                <select id="role-selector" class="form-select form-select-sm" style="width: auto;">
                    <option value="Vendedor">Asesor de Terreno (Vendedor)</option>
                    <option value="Administrador">Administrador de Sistemas</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar-menu" class="col-md-3 col-lg-2 d-md-block bg-navy sidebar collapse p-3 text-white">
                <h5 class="border-bottom border-secondary pb-2 mb-3 text-uppercase tracking-wider small opacity-75">Navegación</h5>
                <ul class="nav flex-column gap-1" id="dynamic-menu-links">
                    </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="view-container">
                </main>
        </div>
    </div>

    <footer class="bg-white text-center py-3 border-top mt-auto text-muted small shadow-sm">
        &copy; 2026 CRM Comercial Prototipo - Funeraria más grande de Chile. Ecosistema de simulación local.
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
